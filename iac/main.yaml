AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Sistema de asistencia con QR (serverless) - GTN 2026-2.
  Una seccion por integrante. Solo servicios serverless, sin EC2.
  Se despliega con scripts/deploy.sh (empaqueta el codigo de las Lambdas).

# =============================================================================
# PARAMETROS (dueno: A)
# =============================================================================
Parameters:
  Ambiente:
    Type: String
    Default: lab
    AllowedValues: [lab, prod]
  NombreEquipo:
    Type: String
    Description: nombre corto del equipo (aparece en los nombres de recursos)
    AllowedPattern: "^[a-z0-9-]{3,20}$"
    ConstraintDescription: minusculas, numeros y guiones (3 a 20 caracteres)
  NombreRolLambda:
    Type: String
    Default: LabRole
    Description: >
      Rol IAM existente que usaran las Lambdas. En AWS Academy Learner Lab no se
      pueden crear roles, se usa LabRole.
  ScanBaseUrl:
    Type: String
    Default: "https://example.com/estudiante/index.html"
    Description: >
      URL de la pagina del estudiante (la define B). El QR codifica
      <ScanBaseUrl>?s=<sessionId>.
  DuracionPorDefecto:
    Type: Number
    Default: 180
    Description: duracion del QR en segundos si el docente no indica otra
  DuracionMaxima:
    Type: Number
    Default: 900
    Description: duracion maxima permitida del QR en segundos
  ThrottleRate:
    Type: Number
    Default: 5
    Description: solicitudes por segundo permitidas en la API (proteccion contra abuso)
  ThrottleBurst:
    Type: Number
    Default: 10
    Description: rafaga maxima de solicitudes en la API

Resources:
  # ===========================================================================
  # BASE COMPARTIDA: API Gateway (dueno: A)
  # B y C cuelgan sus rutas de esta misma API con !Ref Api
  # ===========================================================================
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "gtn-${NombreEquipo}-api"
      ProtocolType: HTTP
      # Las paginas viven en S3 (otro origen), por eso se necesita CORS.
      # TODO (semana 3): restringir AllowOrigins a la URL real de las paginas.
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, x-api-secret]
        MaxAge: 300
      Tags:
        Curso: GTN-2026-2
        Equipo: !Ref NombreEquipo
        Proyecto: asistencia-qr
        Ambiente: !Ref Ambiente

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRate
        ThrottlingBurstLimit: !Ref ThrottleBurst
      Tags:
        Curso: GTN-2026-2
        Equipo: !Ref NombreEquipo
        Proyecto: asistencia-qr
        Ambiente: !Ref Ambiente

  # ===========================================================================
  # SESIONES (dueno: A) - HU-01
  # ===========================================================================
  TablaSesiones:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "gtn-${NombreEquipo}-sesiones"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: sessionId, AttributeType: S}
      KeySchema:
        - {AttributeName: sessionId, KeyType: HASH}
      # OJO: el TTL de DynamoDB borra con retraso (puede tardar horas).
      # La validacion de expiracion NO debe depender del borrado: se compara
      # expiresAt con la hora actual.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: asistencia-qr}
        - {Key: Ambiente, Value: !Ref Ambiente}

  LogsCrearSesion:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/gtn-${NombreEquipo}-crear-sesion"
      RetentionInDays: 7
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}

  FuncionCrearSesion:
    Type: AWS::Lambda::Function
    DependsOn: LogsCrearSesion
    Properties:
      FunctionName: !Sub "gtn-${NombreEquipo}-crear-sesion"
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 10
      Handler: handler.lambda_handler
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${NombreRolLambda}"
      # Esta ruta la reemplaza "aws cloudformation package" (ver scripts/deploy.sh)
      Code: ../build/crear_sesion
      Environment:
        Variables:
          TABLE_NAME: !Ref TablaSesiones
          SCAN_BASE_URL: !Ref ScanBaseUrl
          DEFAULT_DURATION: !Ref DuracionPorDefecto
          MAX_DURATION: !Ref DuracionMaxima
          TZ_OFFSET_HOURS: "-5"
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: asistencia-qr}
        - {Key: Ambiente, Value: !Ref Ambiente}

  IntegracionCrearSesion:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FuncionCrearSesion.Arn
      PayloadFormatVersion: "2.0"

  RutaCrearSesion:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "POST /sesiones"
      Target: !Sub "integrations/${IntegracionCrearSesion}"

  PermisoApiCrearSesion:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FuncionCrearSesion
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/sesiones"

  # ---------------------------------------------------------------------------
  # HOSTING WEB (dueno: A): bucket S3 con las paginas del docente y el estudiante
  # Acceso publico de solo lectura (website estatico). CloudFront se descarta
  # por costo/complejidad frente al objetivo de <1 USD/mes.
  # ---------------------------------------------------------------------------
  BucketWeb:
    Type: AWS::S3::Bucket
    # El contenido se sube con "aws s3 sync" en deploy.sh (no desde CloudFormation).
    Properties:
      BucketName: !Sub "gtn-${NombreEquipo}-web-${AWS::AccountId}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      # Se desactiva el bloqueo de acceso publico para poder servir el sitio.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: asistencia-qr}
        - {Key: Ambiente, Value: !Ref Ambiente}

  PoliticaBucketWeb:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketWeb
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LecturaPublica
            Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${BucketWeb.Arn}/*"

  # --- Borrado limpio: Lambda + custom resource que vacia el bucket web ---
  # Sin esto, delete-stack falla con BucketNotEmpty. Solo se ejecuta durante
  # operaciones de CloudFormation (crear/actualizar/borrar), no en uso normal.
  LogsVaciarBucketWeb:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/gtn-${NombreEquipo}-vaciar-bucket-web"
      RetentionInDays: 7
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}

  FuncionVaciarBucketWeb:
    Type: AWS::Lambda::Function
    DependsOn: LogsVaciarBucketWeb
    Properties:
      FunctionName: !Sub "gtn-${NombreEquipo}-vaciar-bucket-web"
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 120
      Handler: index.handler
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${NombreRolLambda}"
      Environment:
        Variables:
          BUCKET: !Ref BucketWeb
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: asistencia-qr}
        - {Key: Ambiente, Value: !Ref Ambiente}
      Code:
        ZipFile: |
          import os
          import boto3
          import cfnresponse

          s3 = boto3.resource("s3")

          def handler(event, context):
              # Solo actuamos al borrar el stack; crear/actualizar responden OK.
              try:
                  if event["RequestType"] == "Delete":
                      bucket = s3.Bucket(os.environ["BUCKET"])
                      bucket.object_versions.delete()
                      bucket.objects.all().delete()
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as exc:  # noqa: BLE001
                  print(f"ERROR al vaciar el bucket: {type(exc).__name__}: {exc}")
                  # Respondemos SUCCESS en Delete para no dejar el stack atascado.
                  estado = cfnresponse.SUCCESS if event.get("RequestType") == "Delete" else cfnresponse.FAILED
                  cfnresponse.send(event, context, estado, {})

  VaciarBucketWeb:
    Type: AWS::CloudFormation::CustomResource
    # Debe correr antes de que CloudFormation intente borrar el bucket.
    DependsOn: BucketWeb
    Properties:
      ServiceToken: !GetAtt FuncionVaciarBucketWeb.Arn

  # ===========================================================================
  # REGISTRO DE ASISTENCIA (dueno: B) - HU-02
  # Tabla Asistencias, Lambda registrar-asistencia, ruta POST /asistencias
  # ===========================================================================   
  TablaAsistencias:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "gtn-${NombreEquipo}-asistencias"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: sessionId, AttributeType: S}
        - {AttributeName: studentId, AttributeType: S}
        - {AttributeName: courseId, AttributeType: S}
        - {AttributeName: date, AttributeType: S}
      KeySchema:
        - {AttributeName: sessionId, KeyType: HASH}
        - {AttributeName: studentId, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: curso-fecha-index
          KeySchema:
            - {AttributeName: courseId, KeyType: HASH}
            - {AttributeName: date, KeyType: RANGE}
          Projection:
            ProjectionType: ALL
      # Sin TTL (registros historicos) y sin PITR (decision de costo)
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: asistencia-qr}
        - {Key: Ambiente, Value: !Ref Ambiente}  


  LogsRegistrarAsistencia:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/gtn-${NombreEquipo}-registrar-asistencia"
      RetentionInDays: 7
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
 
  FuncionRegistrarAsistencia:
    Type: AWS::Lambda::Function
    DependsOn: LogsRegistrarAsistencia
    Properties:
      FunctionName: !Sub "gtn-${NombreEquipo}-registrar-asistencia"
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      Handler: index.handler
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${NombreRolLambda}"
      Environment:
        Variables:
          TABLA_SESIONES: !Ref TablaSesiones
          TABLA_ASISTENCIAS: !Ref TablaAsistencias
      Tags:
        - {Key: Curso, Value: GTN-2026-2}
        - {Key: Equipo, Value: !Ref NombreEquipo}
        - {Key: Proyecto, Value: asistencia-qr}
        - {Key: Ambiente, Value: !Ref Ambiente}
      Code:
        ZipFile: |
          import base64
          import json
          import os
          import re
          import time
 
          import boto3
          from botocore.exceptions import ClientError
 
          dynamodb = boto3.client("dynamodb")
 
          TABLA_SESIONES = os.environ["TABLA_SESIONES"]
          TABLA_ASISTENCIAS = os.environ["TABLA_ASISTENCIAS"]
 
          # sessionId: token aleatorio urlsafe. studentId: codigo numerico de 6 a 12 digitos.
          RE_SESSION = re.compile(r"^[A-Za-z0-9_-]{16,128}$")
          RE_STUDENT = re.compile(r"^[0-9]{6,12}$")
 
          HEADERS = {
              "Content-Type": "application/json",
              "Access-Control-Allow-Origin": "*",
          }
 
 
          def respuesta(codigo, cuerpo):
              return {
                  "statusCode": codigo,
                  "headers": HEADERS,
                  "body": json.dumps(cuerpo, ensure_ascii=False),
              }
 
 
          def handler(event, context):
              # 1. Leer y validar el cuerpo
              try:
                  raw = event.get("body") or ""
                  if event.get("isBase64Encoded"):
                      raw = base64.b64decode(raw).decode("utf-8")
                  datos = json.loads(raw)
              except (ValueError, UnicodeDecodeError):
                  return respuesta(400, {"status": "error", "mensaje": "Cuerpo JSON invalido"})
 
              if not isinstance(datos, dict):
                  return respuesta(400, {"status": "error", "mensaje": "Cuerpo JSON invalido"})
 
              session_id = datos.get("sessionId")
              student_id = datos.get("studentId")
 
              if not isinstance(session_id, str) or not RE_SESSION.match(session_id):
                  return respuesta(400, {"status": "error", "mensaje": "sessionId invalido"})
              if not isinstance(student_id, str):
                  return respuesta(400, {"status": "error", "mensaje": "studentId invalido"})
              student_id = student_id.strip()
              if not RE_STUDENT.match(student_id):
                  return respuesta(400, {"status": "error", "mensaje": "studentId debe ser numerico (6 a 12 digitos)"})
 
              # 2. Buscar la sesion (lectura consistente: el QR puede ser recien creado)
              try:
                  r = dynamodb.get_item(
                      TableName=TABLA_SESIONES,
                      Key={"sessionId": {"S": session_id}},
                      ConsistentRead=True,
                  )
              except ClientError:
                  print("ERROR get_item sesiones", flush=True)
                  return respuesta(500, {"status": "error", "mensaje": "Error interno"})
 
              sesion = r.get("Item")
              if not sesion:
                  return respuesta(404, {"status": "error", "mensaje": "Sesion inexistente"})
 
              # 3. Validar expiracion con la hora del servidor (no depender del TTL de DynamoDB)
              try:
                  expires_at = int(sesion["expiresAt"]["N"])
                  course_id = sesion["courseId"]
                  fecha = sesion["date"]
              except (KeyError, ValueError):
                  print("ERROR sesion con formato inesperado", flush=True)
                  return respuesta(500, {"status": "error", "mensaje": "Error interno"})
 
              ahora = int(time.time())
              if ahora >= expires_at:
                  return respuesta(410, {"status": "error", "mensaje": "El QR ha expirado"})
 
              # 4. Escritura condicional: evita duplicados incluso con solicitudes simultaneas
              try:
                  dynamodb.put_item(
                      TableName=TABLA_ASISTENCIAS,
                      Item={
                          "sessionId": {"S": session_id},
                          "studentId": {"S": student_id},
                          "courseId": course_id,
                          "date": fecha,
                          "registeredAt": {"N": str(ahora)},
                      },
                      ConditionExpression="attribute_not_exists(sessionId)",
                  )
              except ClientError as e:
                  if e.response["Error"]["Code"] == "ConditionalCheckFailedException":
                      return respuesta(409, {"status": "error", "mensaje": "Ya registraste tu asistencia en esta sesion"})
                  print("ERROR put_item asistencias", flush=True)
                  return respuesta(500, {"status": "error", "mensaje": "Error interno"})
 
              return respuesta(200, {"status": "registrado"})
 
  IntegracionRegistrarAsistencia:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FuncionRegistrarAsistencia.Arn
      PayloadFormatVersion: "2.0"
 
  RutaRegistrarAsistencia:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "POST /asistencias"
      Target: !Sub "integrations/${IntegracionRegistrarAsistencia}"
 
  PermisoApiRegistrarAsistencia:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FuncionRegistrarAsistencia
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/asistencias"
  # ===========================================================================
  # REPORTES Y COSTOS (dueno: C) - HU-03 / HU-04
  # Bucket de reportes, EventBridge, Lambda generar-reporte, ruta GET /reportes
  # ===========================================================================

Outputs:
  ApiUrl:
    Description: URL base de la API (B y C la usan para sus rutas)
    Value: !GetAtt Api.ApiEndpoint
  ApiId:
    Description: Id de la API HTTP
    Value: !Ref Api
  CrearSesionUrl:
    Description: Endpoint del docente (POST)
    Value: !Sub "${Api.ApiEndpoint}/sesiones"
  TablaSesionesNombre:
    Description: Nombre de la tabla Sesiones (B la usa para validar tokens)
    Value: !Ref TablaSesiones
  TablaSesionesArn:
    Description: ARN de la tabla Sesiones (para politicas IAM de B)
    Value: !GetAtt TablaSesiones.Arn
  BucketWebNombre:
    Description: Nombre del bucket S3 que hospeda las paginas web
    Value: !Ref BucketWeb
  WebUrlBase:
    Description: URL base del sitio web estatico (S3 website)
    Value: !GetAtt BucketWeb.WebsiteURL
  WebUrlDocente:
    Description: URL de la pagina del docente
    Value: !Sub "${BucketWeb.WebsiteURL}/docente/index.html"
  WebUrlEstudiante:
    Description: URL de la pagina del estudiante (usar como ScanBaseUrl)
    Value: !Sub "${BucketWeb.WebsiteURL}/estudiante/index.html"